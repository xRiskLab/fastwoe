name: Python Version Compatibility

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # schedule:
  #   # Run weekly on Sundays (disabled to save GitHub Actions minutes)
  #   - cron: '0 0 * * 0'

jobs:
  compatibility-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            python-version-short: 'py39'
            sklearn-version: '1.3.2'
          - python-version: '3.12'
            python-version-short: 'py312'
            sklearn-version: '1.6.1'
          - python-version: '3.13'
            python-version-short: 'py313'
            sklearn-version: 'latest'
          - python-version: '3.14'
            python-version-short: 'py314'
            sklearn-version: 'latest'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.python-version }}-
          ${{ runner.os }}-uv-

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --dev
        if [ "${{ matrix.sklearn-version }}" != "latest" ]; then
          uv add "scikit-learn==${{ matrix.sklearn-version }}"
        else
          uv add "scikit-learn"
        fi

    - name: Run compatibility tests
      run: |
        echo "Testing Python ${{ matrix.python-version }} compatibility"
        uv run python -c "import fastwoe; print(f'fastwoe version: {fastwoe.__version__}')"
        uv run python -m pytest tests/test_compatibility.py tests/test_softmax_woe.py -v --tb=short \
          --junitxml=test-results/junit.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version-short }}
        path: test-results/junit.xml
        if-no-files-found: warn
        retention-days: 7

  compatibility-summary:
    runs-on: ubuntu-latest
    needs: compatibility-test
    if: always()

    steps:
    - name: Download all test results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: test-results/

    - name: Write compatibility summary
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import glob
        import os
        import xml.etree.ElementTree as ET

        print("## Python version compatibility")
        print()
        print("| Job | Tests | Passed | Failures | Errors | Skipped |")
        print("|---|---|---|---|---|---|")
        files = sorted(glob.glob("test-results/*/junit.xml"))
        for path in files:
            job = os.path.basename(os.path.dirname(path)).removeprefix("test-results-")
            root = ET.parse(path).getroot()
            suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
            tests, failures, errors, skipped = (
                sum(int(s.get(key, 0)) for s in suites)
                for key in ("tests", "failures", "errors", "skipped")
            )
            passed = tests - failures - errors - skipped
            mark = "✅" if failures + errors == 0 else "❌"
            print(f"| {mark} {job} | {tests} | {passed} | {failures} | {errors} | {skipped} |")
        if not files:
            print("| no results uploaded | | | | | |")
        PY
        cat "$GITHUB_STEP_SUMMARY"

    - name: Fail if any compatibility job failed
      if: needs.compatibility-test.result != 'success'
      run: |
        echo "compatibility-test result: ${{ needs.compatibility-test.result }}"
        exit 1
